<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Chat</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header class="topbar"><div><div class="brand">AI Chat</div><div class="status"><span></span> Ready</div></div><label class="model-wrap"><span>Model</span><select id="model"><option>grok-4.5</option><option>grok-4.5-latest</option><option>grok-4.6</option><option>grok-4.7</option><option>grok-latest</option><option>grok</option><option>composer-2.5</option><option>grok-build-latest</option><option>grok-composer</option><option>grok-composer-2.5-fast</option></select></label></header><section id="messages" class="messages"><div class="welcome"><div class="welcome-icon">✦</div><h1>How can I help?</h1><p>Select a model and start a conversation.</p></div></section><form id="chat-form" class="composer"><textarea id="input" rows="1" placeholder="Message the AI..." autocomplete="off"></textarea><button id="send" type="submit" aria-label="Send">↑</button></form><div class="footer">AI responses may be inaccurate. Verify important information.</div></main><script src="/app.js"></script></body></html>
